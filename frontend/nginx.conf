server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend-owned prefixes. Same origin as the SPA, so no CORS involved and no
    # API URL is baked into the bundle — VITE_API_URL stays empty and the SPA
    # calls relative /api/v1 (matching `make web`, which proxies the same way).
    #   /api/    — DRF
    #   /admin/  — Django admin
    #   /static/ — Django's own static files (admin CSS), served by whitenoise
    # Django's /login/, /dashboard/, /logout/ and / are deliberately NOT proxied:
    # those paths belong to the SPA router. The same-named Django template views in
    # core/views.py are scaffolds, reachable only through /admin/.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through what the upstream proxy/tunnel said, NOT $scheme — nginx is
        # reached over plain HTTP, so $scheme would tell Django "http" and silently
        # defeat SECURE_PROXY_SSL_HEADER.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # TanStack Router owns /dashboard, /login, /onboarding client-side:
    # every unknown path must fall through to index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
